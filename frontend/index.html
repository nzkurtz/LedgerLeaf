<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerLeaf - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <span class="brand-icon">🍃</span>
            <span class="brand-name">LedgerLeaf</span>
        </div>
        <div class="navbar-menu">
            <button class="nav-btn active" onclick="switchTab('dashboard')">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </button>
            <button class="nav-btn" onclick="switchTab('transactions')">
                <span class="nav-icon">💳</span>
                <span>Transactions</span>
            </button>
            <button class="nav-btn" onclick="switchTab('loan')">
                <span class="nav-icon">🧮</span>
                <span>Loan Calculator</span>
            </button>
        </div>
        <div class="navbar-tagline">
            <span>Grow Your Financial Future</span>
        </div>
    </nav>

    <div class="container">

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="section active">
            <div class="summary-cards">
                <div class="summary-card income-card">
                    <div class="card-label">Total Income</div>
                    <div class="card-value" id="totalIncome">$0.00</div>
                </div>
                <div class="summary-card expense-card">
                    <div class="card-label">Total Expenses</div>
                    <div class="card-value" id="totalExpenses">$0.00</div>
                </div>
                <div class="summary-card net-card">
                    <div class="card-label">Net</div>
                    <div class="card-value" id="netAmount">$0.00</div>
                </div>
            </div>

            <div class="card">
                <h2>Spending by Category</h2>
                <div id="categoryBreakdown" class="category-list">
                    <p class="text-muted">No expenses yet</p>
                </div>
            </div>

            <div class="card">
                <h2>Recent Transactions</h2>
                <div id="recentTransactions" class="transaction-list">
                    <p class="text-muted">No transactions yet</p>
                </div>
            </div>
        </section>

        <!-- Transactions Section -->
        <section id="transactions-section" class="section">
            <div class="card">
                <h2>Add Transaction</h2>

                <div class="transaction-type-toggle">
                    <button id="expense-btn" class="toggle-btn active" onclick="setTransactionType('expense')">Expense</button>
                    <button id="income-btn" class="toggle-btn" onclick="setTransactionType('income')">Income</button>
                </div>

                <form id="transaction-form" onsubmit="addTransaction(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount ($)</label>
                            <input id="amount" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input id="date" type="date" required>
                        </div>
                    </div>

                    <div id="expense-fields">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="">Select category</option>
                                <option value="Housing">Housing</option>
                                <option value="Food">Food & Dining</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Personal">Personal Care</option>
                                <option value="Education">Education</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input id="description" type="text" placeholder="e.g., Grocery shopping">
                        </div>
                    </div>

                    <div id="income-fields" style="display: none;">
                        <div class="form-group">
                            <label for="source">Source</label>
                            <input id="source" type="text" placeholder="e.g., Salary, Freelance">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
            </div>

            <div class="card">
                <div class="filter-header">
                    <h2>All Transactions</h2>
                    <div class="filter-controls">
                        <select id="filterCategory" onchange="loadTransactions()">
                            <option value="">All Categories</option>
                            <option value="Housing">Housing</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Personal">Personal Care</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div id="allTransactions" class="transaction-list">
                    <p class="text-muted">No transactions yet</p>
                </div>
            </div>
        </section>

        <!-- Loan Section -->
        <section id="loan-section" class="section">
            <div class="card">
                <h2>Loan Calculator</h2>

                <div class="form-group">
                    <label for="principal">Loan Amount ($)</label>
                    <input id="principal" type="number" placeholder="e.g., 25000" step="0.01">
                </div>

                <div class="form-group">
                    <label for="rate">Annual Interest Rate (%)</label>
                    <input id="rate" type="number" placeholder="e.g., 5.5" step="0.01">
                </div>

                <div class="form-group">
                    <label for="years">Loan Term (years)</label>
                    <input id="years" type="number" placeholder="e.g., 5" min="1" max="30">
                </div>

                <div class="form-group">
                    <label for="extra_payment">Extra Monthly Payment ($)</label>
                    <input id="extra_payment" type="number" placeholder="0" step="0.01">
                    <small>Optional: Pay off your loan faster</small>
                </div>

                <button onclick="calculateLoan()" class="btn-primary">Calculate Loan</button>

                <div id="loanResult" class="result-container"></div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
